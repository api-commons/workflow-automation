context: workflow-automation
name: Workflow Automation
intro: >-
  The common workflow-automation vocabulary -- the workflows people build, the triggers that
  start them, the runs that execute them and the connections to other apps they act through
  -- distilled from the APIs that already exist. CI/CD pipelines belong to their own context.
tags: [Workflow Automation, iPaaS, Integration Platform, No-Code, Low-Code, Workflows, Automation Platform, Integration]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, nextCursor]

common_fields:
  id: [uuid, guid, object_id, record_id, workflow_id, flow_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, createdAt, started_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, active, is_active, enabled, is_enabled, is_paused, paused]
  name: [title, display_name, label]
  description: [notes, note, details]
  workflow_id: [workflow, flow, flow_id, scenario_id, zap_id, automation_id, recipe_id, template_id]

concepts:
  workflow:
    segments: [workflows, flows, flow, scenarios, scenario, zaps, zap, automations, automation, recipes, playbooks, sequences@automation, bots@workflow]
    aliases:
      steps: [nodes, actions, tasks, modules, blueprint, definition, graph, connections_graph, operations]
      trigger: [triggers, trigger_type, start_trigger, scheduling, schedule]
      folder_id: [folder, project_id, project, workspace_id, team_id]
  workflow_run:
    requires: [workflow]
    path: /workflow-runs
    # Singular /run is an action (run a backup, run an agent); only runs and executions count.
    segments: [executions, runs, workflow_runs, flow_runs, jobs@workflows|flows, logs@scenarios|executions, history@flows|zaps|workflows]
    aliases:
      started_at: [start_time, started, startedAt, start]
      finished_at: [stopped_at, ended_at, completed_at, end_time, finished, stoppedAt]
      error: [error_message, failure_reason, errors, message]
      mode: [trigger_type, source, kind, execution_mode]
  trigger:
    requires: [workflow]
    segments: [triggers, trigger, webhooks@workflows|flows|scenarios, hooks@workflows|flows]
    aliases:
      type: [trigger_type, kind, event, event_type, source]
      config: [configuration, settings, parameters, schedule, cron]
  connection:
    requires: [workflow]
    segments: [connections, connection, credentials, credential, accounts@integrations|connections, authorizations, integrations@workflows|platform, connected_accounts]
    aliases:
      app: [app_id, application, service, connector, provider, integration, type, app_key]
      expires_at: [expiry, expiration, token_expires_at]

duplicates:
  albato: [albato-a-single-no-code-platform-for-all-automations]
  ethena: [goethena]
  webflow: [webflow-api-and-documentation-webflow]

findings:
  - "A workflow agrees on id, name, status and description across iPaaS platforms, no-code
    builders, RPA tools and AI-agent orchestrators -- Zapier's zaps, Make's scenarios and n8n's
    workflows are one concept."
  - "A connection agrees on id, name, the app it connects, status and created_at: the
    credential-to-an-app is the most uniform resource in integration platforms."
  - "A run agrees only on id and status: what a run records (steps, logs, errors) is the
    platform's own."
decisions:
  - "The bare Automation tag is not used: it covers industrial automation and RPA hardware."
  - "A workflow covers flows, scenarios, zaps, automations, recipes and playbooks; CI pipelines
    are the CI/CD context's."
  - "Runs are `/workflow-runs` (CI/CD owns `/runs`); singular `/run` and `/execution` are
    actions and do not count."
  - "Credentials, authorizations and connected accounts are connections."
  - "Duplicates merged: Albato, Ethena, Webflow."
